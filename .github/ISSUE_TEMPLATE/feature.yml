name: Feature request
description: Propose a focused improvement to this repository.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or smaller options have been considered?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Operational and compatibility impact
      description: Note migration, security, cost, rollout, or backward-compatibility concerns.
    validations:
      required: false
