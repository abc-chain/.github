name: Bug report
description: Report a reproducible problem in this repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, production data, or security vulnerabilities.
        Follow SECURITY.md for private vulnerability reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant version, operating system, runtime, and commit details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add logs or screenshots only after removing sensitive data.
    validations:
      required: false
